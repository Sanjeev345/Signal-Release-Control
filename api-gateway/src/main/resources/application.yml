server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: excerpts
              uri: lb://podcast-excerpt-service
              predicates:
                - Path=/api/excerpts/**
            - id: releases
              uri: lb://guest-release-service
              predicates:
                - Path=/api/releases/**
            - id: distribution
              uri: lb://distribution-task-service
              predicates:
                - Path=/api/distribution/**
            - id: notifications
              uri: lb://podcast-excerpt-service
              predicates:
                - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

app:
  security:
    issuer: ${JWT_ISSUER:http://localhost:8180/realms/podcast-demo}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8180/realms/podcast-demo/protocol/openid-connect/certs}
    audience: ${JWT_AUDIENCE:podcast-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: WARN
